<svg width="100%" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff007f" stop-opacity="1"/>
      <stop offset="75%" stop-color="#7000ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="10, 20; 50, 10; 10, 20" dur="4s" repeatCount="indefinite" />
  </line>
  <circle cx="600" cy="12" r="5" fill="#ff007f" filter="url(#glow)">
    <animate attributeName="r" values="4; 7; 4" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="12" r="2" fill="#ffffff" />
</svg>
